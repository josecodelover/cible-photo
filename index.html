<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1d3b2a">
<meta name="mobile-web-app-capable" content="yes">
<title>Cible Photo</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #eef2ef; --card: #fff; --ink: #1f2420; --muted: #6b716c; --line: #d3dcd6;
    --accent: #1d3b2a; --accent2: #2f6b4a;
    --gold: #f5c518; --red: #e0352b; --blue: #2a9de1; --black: #222; --white: #f7f7f7; --miss: #9aa09b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; }
  body { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--accent); color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; font-weight: 600; }
  header button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-size: .95rem; }
  main { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 1rem; margin: 0 0 10px; color: var(--accent); }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  input[type=number] { width: 100%; font-size: 1.05rem; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  .seg { display: flex; background: #e1e8e3; border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 9px 4px; border-radius: 8px; font-size: .9rem; color: var(--ink); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .btn { border: 0; border-radius: 12px; padding: 13px; font-size: 1rem; font-weight: 600; background: var(--accent); color: #fff; width: 100%; }
  .btn.sec { background: #d8e1db; color: var(--ink); }
  .btn.sm { padding: 10px 8px; font-size: .9rem; }
  .btn:disabled { opacity: .4; }
  .hint { font-size: .8rem; color: var(--muted); }
  .link { background: none; border: 0; color: var(--accent2); text-decoration: underline; font-size: .85rem; padding: 6px 0 0; }
  .hidden { display: none !important; }

  /* Analyse */
  .msg { font-size: .88rem; background: #fff7d6; border-radius: 10px; padding: 8px 10px; }
  .cvwrap { margin: 0 -14px; background: #111; }
  canvas#cv, canvas#zcv { display: block; width: 100%; height: min(60vh, 140vw); touch-action: none; }
  .qual { border-radius: 10px; padding: 9px 11px; margin-bottom: 10px; font-size: .86rem; line-height: 1.35; }
  .qual b { display: block; font-size: .95rem; margin-bottom: 2px; }
  .qual.good { background: #dff3e6; color: #14532d; }
  .qual.mid { background: #fff3cd; color: #6b4e00; }
  .qual.bad { background: #fde0dd; color: #8a1c13; }
  ol.steps { margin: 10px 0 0; padding-left: 20px; font-size: .86rem; line-height: 1.45; color: var(--ink); }
  .cam { position: relative; margin: 0 -14px; aspect-ratio: 3 / 4; background: #000; overflow: hidden; }
  .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .camtip { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: #fff; font-size: .85rem; text-shadow: 0 1px 3px #000; padding: 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { border: 2px solid transparent; border-radius: 10px; min-width: 52px; padding: 6px 8px; font-weight: 700; font-size: 1.05rem; text-align: center; }
  .chip small { display: block; font-size: .65rem; font-weight: 500; opacity: .8; }
  .chip.sel { border-color: #ff2fb0; box-shadow: 0 0 0 2px #ff2fb055; }
  .tot { margin-left: auto; text-align: right; font-size: .75rem; color: var(--muted); }
  .tot b { display: block; font-size: 1.5rem; color: var(--ink); }

  /* Couleurs des zones */
  .z-X, .z-10, .z-9 { background: var(--gold); color: #222; }
  .z-8, .z-7 { background: var(--red); color: #fff; }
  .z-6, .z-5 { background: var(--blue); color: #fff; }
  .z-4, .z-3 { background: var(--black); color: #fff; }
  .z-2, .z-1 { background: var(--white); color: #222; box-shadow: inset 0 0 0 1px var(--line); }
  .z-M { background: var(--miss); color: #fff; }

  /* Feuille */
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: 7px 4px; text-align: center; border-bottom: 1px solid var(--line); }
  th { font-size: .75rem; color: var(--muted); font-weight: 600; }
  td.arr { text-align: left; }
  tfoot td { font-weight: 700; border-bottom: 0; }
  .mini { display: inline-block; min-width: 24px; padding: 2px 3px; margin: 1px; border-radius: 5px; font-size: .82rem; font-weight: 700; text-align: center; }
  .stats { display: flex; justify-content: space-around; text-align: center; margin-top: 10px; }
  .stats span { display: block; font-size: .72rem; color: var(--muted); }
  .stats b { font-size: 1.25rem; }
  svg.grp { width: 100%; display: block; border-radius: 10px; background: #cfd6d1; }
</style>

<body>
<header>
  <h1>🎯 Cible Photo</h1>
  <button id="hdrBack" class="hidden">✕ Fermer</button>
</header>
<main id="app"></main>
<input type="file" id="fCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fGal" accept="image/*" class="hidden">

<script>
"use strict";
/* ===================================================================
   Cible Photo — lecture des scores de tir à l'arc sur une photo.
   1. détection du blason (anneaux de couleur -> ellipses)
   2. détection des flèches (ce qui n'a pas la couleur de l'anneau)
   3. correction à la main, puis feuille de marque et groupement
   =================================================================== */
const STORE = "ciblePhoto.v1";
const FACES = {
  // max : rayon marquant (en largeurs d'anneau) · dom : zone analysée · min : plus petite valeur
  tri:  { name: "Trispot", max: 5,  dom: 5.4, min: 6, bounds: [["Y", 2], ["R", 4], ["B", 5]] },
  full: { name: "Blason complet", max: 10, dom: 10, min: 1, bounds: [["Y", 2], ["R", 4], ["B", 6], ["K", 8]] },
};
const ZCOL = ["#f5c518", "#f5c518", "#e0352b", "#e0352b", "#2a9de1", "#2a9de1", "#222", "#222", "#f7f7f7", "#f7f7f7"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = s => document.querySelector(s);
const app = $("#app"), hdrBack = $("#hdrBack");

let S = load() || { cfg: { face: "tri", diam: 40, shaft: 6, ten: "x", perEnd: 3 }, ends: [] };
let screen = "home";
let A = null;   // analyse en cours
let cam = null; // flux vidéo de la visée

function save() { localStorage.setItem(STORE, JSON.stringify(S)); }
function load() { try { const s = JSON.parse(localStorage.getItem(STORE)); return s && s.cfg && s.ends ? s : null; } catch { return null; } }
const face = () => FACES[S.cfg.face];
const med = a => { if (!a.length) return 0; const b = Float64Array.from(a).sort(); return b[b.length >> 1]; };

/* ---------- valeurs ---------- */
const val = v => v === "X" ? 10 : v === "M" ? 0 : +v;
const ord = v => v === "X" ? 11 : val(v);
/* rayon du tube, en largeurs d'anneau (un anneau = diamètre / 20) */
const shaftU = () => (S.cfg.shaft / 2) / (S.cfg.diam * 10 / 20);
/* r : distance du centre de l'impact au centre, en largeurs d'anneau. Un cordon touché compte. */
function scoreAt(r) {
  const F = face(), re = Math.max(0, r - shaftU());
  if (re >= F.max) return "M";
  const v = 10 - Math.floor(re);
  if (v >= 10) {
    if (S.cfg.ten === "small") return re < 0.5 ? "10" : "9";
    return S.cfg.ten === "x" && re < 0.5 ? "X" : "10";
  }
  return v < F.min ? "M" : String(v);
}
function ladder() {
  const F = face(), l = ["M"];
  for (let v = F.min; v <= 10; v++) l.push(String(v));
  if (S.cfg.ten === "x") l.push("X");
  return l;
}

/* ---------- géométrie : ellipses ---------- */
function rho(e, x, y) {
  const dx = x - e.cx, dy = y - e.cy, c = Math.cos(e.th), s = Math.sin(e.th);
  return Math.hypot((dx * c + dy * s) / e.a, (-dx * s + dy * c) / e.b);
}
/* Rayon (en anneaux) d'un point, interpolé entre les ellipses détectées d'un spot. */
function radius(sp, x, y) {
  const E = sp.els;
  let p = rho(E[0], x, y);
  if (p <= 1 || E.length === 1) return p * E[0].R;
  for (let i = 1; i < E.length; i++) {
    const q = rho(E[i], x, y);
    if (q <= 1) {
      // position entre les deux ellipses, vue depuis l'intérieure (t1) et depuis l'extérieure (t2)
      const k = E[i].R / E[i - 1].R, t1 = (p - 1) / (k - 1), t2 = (q - 1 / k) / (1 - 1 / k), m = Math.min(1, Math.max(0, (t1 + t2) / 2));
      return E[i - 1].R + Math.min(1, Math.max(0, (1 - m) * t1 + m * t2)) * (E[i].R - E[i - 1].R);
    }
    p = q;
  }
  return p * E[E.length - 1].R;
}
/* Ellipse de l'anneau de rayon R (pour le tracé). */
function ellAt(sp, R) {
  const E = sp.els, L = E[E.length - 1];
  if (R <= E[0].R || E.length === 1) { const k = R / E[0].R; return { ...E[0], a: E[0].a * k, b: E[0].b * k }; }
  for (let i = 1; i < E.length; i++) if (R <= E[i].R) {
    const p = E[i - 1], q = E[i], t = (R - p.R) / (q.R - p.R);
    let d = q.th - p.th; while (d > Math.PI / 2) d -= Math.PI; while (d < -Math.PI / 2) d += Math.PI;
    return { cx: p.cx + t * (q.cx - p.cx), cy: p.cy + t * (q.cy - p.cy), a: p.a + t * (q.a - p.a), b: p.b + t * (q.b - p.b), th: p.th + t * d };
  }
  const k = R / L.R; return { ...L, a: L.a * k, b: L.b * k };
}
const outer = sp => sp.els[sp.els.length - 1];
const ringPx = sp => { const o = outer(sp); return Math.sqrt(o.a * o.b) / o.R; };
/* Position d'un impact sur le blason : spot le plus proche, rayon, coordonnées normalisées. */
function locate(x, y) {
  let best = null;
  A.spots.forEach((sp, si) => { const r = radius(sp, x, y); if (!best || r < best.r) best = { si, r }; });
  if (!best) return null;
  const o = outer(A.spots[best.si]), dx = x - o.cx, dy = y - o.cy, c = Math.cos(o.th), s = Math.sin(o.th);
  const u = (dx * c + dy * s) / o.a, v = (-dx * s + dy * c) / o.b, n = Math.hypot(u, v) || 1;
  best.nx = (u * c - v * s) / n * best.r; best.ny = (u * s + v * c) / n * best.r;
  return best;
}
/* Cordon à juger : le bord du tube passe à moins d'un dixième d'anneau d'une ligne.
   À cette distance la photo ne permet pas de trancher, c'est à l'archer de regarder. */
/* Position d'un impact avec son rayon corrigé : rz = rayon mesuré sur un gros plan,
   dr = recalage sur le trait réellement imprimé à côté de l'impact. */
function hitLoc(h) {
  const l = locate(h.x, h.y);
  if (l) { if (h.rz != null) l.r = h.rz; else if (h.dr) l.r = Math.max(0, l.r + h.dr); }
  return l;
}
/* Marge d'incertitude d'un impact, en largeurs d'anneau : selon la façon dont il a été mesuré. */
const TOL = { zoom: 0.03, fine: 0.06, raw: 0.1 };
const hitTol = h => h.rz != null ? h.rzTol || TOL.zoom : h.fine && h.cal && !h.unsure ? TOL.fine : TOL.raw;
function cordon(h) {
  const l = hitLoc(h); if (!l) return false;
  const F = face(), re = l.r - shaftU(), tol = hitTol(h); if (re > F.max + tol) return false;
  if (S.cfg.ten !== "plain" && Math.abs(re - 0.5) < tol) return true;
  return re > 0.9 && Math.abs(re - Math.round(re)) < tol;
}
const hitVal = h => { if (h.ov) return h.ov; const l = hitLoc(h); return l ? scoreAt(l.r) : "M"; };
/* Valeurs retenues pour la volée. Trispot : une flèche par spot ; si plusieurs flèches sont dans le même spot,
   seule la moins bonne compte et les autres valent M (dup). */
function endVals() {
  const raw = A.hits.map(hitVal), out = raw.map(v => ({ v, dup: false }));
  if (S.cfg.face !== "tri") return out;
  const by = {};
  A.hits.forEach((h, i) => { const l = locate(h.x, h.y); if (l && raw[i] !== "M") (by[l.si] = by[l.si] || []).push(i); });
  for (const g of Object.values(by)) if (g.length > 1) {
    const keep = g.reduce((a, b) => ord(raw[b]) < ord(raw[a]) ? b : a);
    for (const i of g) if (i !== keep) out[i] = { v: "M", dup: true };
  }
  return out;
}

/* Ajustement d'ellipse par moindres carrés (conique), avec rejet des points aberrants. */
function gauss(M) {                       // résout M (n lignes, n+1 colonnes) par pivot de Gauss
  const n = M.length;
  for (let i = 0; i < n; i++) {
    let pv = i; for (let k = i + 1; k < n; k++) if (Math.abs(M[k][i]) > Math.abs(M[pv][i])) pv = k;
    if (Math.abs(M[pv][i]) < 1e-12) return null;
    [M[i], M[pv]] = [M[pv], M[i]];
    for (let k = 0; k < n; k++) if (k !== i) { const f = M[k][i] / M[i][i]; for (let j = i; j <= n; j++) M[k][j] -= f * M[i][j]; }
  }
  return M.map((r, i) => r[n] / r[i]);
}
function conicFit(P) {
  const n = P.length; if (n < 6) return null;
  let mx = 0, my = 0; for (const p of P) { mx += p[0]; my += p[1]; } mx /= n; my /= n;
  let sc = 0; for (const p of P) sc += Math.hypot(p[0] - mx, p[1] - my); sc /= n; if (!sc) return null;
  const M = Array.from({ length: 5 }, () => new Float64Array(6));
  for (const p of P) {
    const x = (p[0] - mx) / sc, y = (p[1] - my) / sc, row = [x * x, x * y, y * y, x, y];
    for (let i = 0; i < 5; i++) { for (let j = 0; j < 5; j++) M[i][j] += row[i] * row[j]; M[i][5] += row[i]; }
  }
  const sol = gauss(M); if (!sol) return null;
  const [a, b, c, d, e] = sol;
  const den = 4 * a * c - b * b; if (den <= 0) return null;
  const x0 = (b * e - 2 * c * d) / den, y0 = (b * d - 2 * a * e) / den;
  const k = -(a * x0 * x0 + b * x0 * y0 + c * y0 * y0 + d * x0 + e * y0 - 1);
  const h = Math.hypot((a - c) / 2, b / 2), l1 = (a + c) / 2 + h, l2 = (a + c) / 2 - h;
  if (k / l1 <= 0 || k / l2 <= 0) return null;
  const el = { cx: mx + x0 * sc, cy: my + y0 * sc, a: Math.sqrt(k / l2) * sc, b: Math.sqrt(k / l1) * sc, th: 0.5 * Math.atan2(b, a - c) + Math.PI / 2 };
  return el.b / el.a < 0.25 ? null : el;
}
function fitEllipse(P) {
  let pts = P, e = null;
  for (let it = 0; it < 5; it++) {
    e = conicFit(pts); if (!e) return null;
    const res = pts.map(p => Math.abs(rho(e, p[0], p[1]) - 1)), thr = Math.max(0.03, 2.5 * med(res));
    const keep = pts.filter((p, i) => res[i] <= thr);
    if (keep.length === pts.length || keep.length < 12) break;
    pts = keep;
  }
  return e;
}

/* ---------- vision : outils ---------- */
/* Classes de couleur : 0 autre, 1 jaune, 2 rouge, 3 bleu, 4 noir, 5 blanc */
function classify(d, n) {
  const cls = new Uint8Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    const r = d[j], g = d[j + 1], b = d[j + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b), v = mx / 255, s = mx ? (mx - mn) / mx : 0;
    if (v < 0.22 || (v < 0.36 && s < 0.35)) { cls[i] = 4; continue; }
    if (s < 0.2) { cls[i] = v >= 0.55 ? 5 : 0; continue; }
    let h = mx === r ? ((g - b) / (mx - mn)) % 6 : mx === g ? (b - r) / (mx - mn) + 2 : (r - g) / (mx - mn) + 4;
    h *= 60; if (h < 0) h += 360;
    if (h >= 36 && h <= 75 && s >= 0.45 && v >= 0.4) cls[i] = 1;
    else if ((h <= 20 || h >= 330) && s >= 0.45 && v >= 0.25) cls[i] = 2;
    else if (h >= 170 && h <= 250 && s >= 0.3) cls[i] = 3;
  }
  return cls;
}
function morph(m, w, h, r, grow) {       // dilatation (grow) ou érosion par un carré de rayon r
  const t = new Uint8Array(w * h), o = new Uint8Array(w * h), hit = grow ? 1 : 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let v = 1 - hit;
    for (let k = Math.max(0, x - r), e = Math.min(w - 1, x + r); k <= e; k++) if (m[y * w + k] === hit) { v = hit; break; }
    if (!grow && (x < r || x > w - 1 - r)) v = 0;
    t[y * w + x] = v;
  }
  for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) {
    let v = 1 - hit;
    for (let k = Math.max(0, y - r), e = Math.min(h - 1, y + r); k <= e; k++) if (t[k * w + x] === hit) { v = hit; break; }
    o[y * w + x] = v;
  }
  return o;
}
function components(m, w, h) {          // composantes connexes (8 voisins) -> listes d'indices
  const seen = new Uint8Array(w * h), stack = new Int32Array(w * h), out = [];
  for (let s = 0; s < w * h; s++) {
    if (!m[s] || seen[s]) continue;
    let top = 0; stack[top++] = s; seen[s] = 1; const px = [];
    while (top) {
      const i = stack[--top], x = i % w, y = (i / w) | 0; px.push(i);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const X = x + dx, Y = y + dy; if (X < 0 || Y < 0 || X >= w || Y >= h) continue;
        const j = Y * w + X; if (m[j] && !seen[j]) { seen[j] = 1; stack[top++] = j; }
      }
    }
    out.push(px);
  }
  return out;
}

/* ---------- vision : blason ---------- */
/* Depuis le centre jaune, on lance des rayons et on repère les changements de couleur ;
   une ellipse est ajustée sur chaque frontière (jaune/rouge, rouge/bleu, ...). */
function fitSpot(cls, d, w, h, cx, cy, ry, avoid) {
  const F = face(), CODE = { Y: 1, R: 2, B: 3, K: 4 }, NB = F.bounds.length, NR = 160, win = Math.max(2, Math.round(ry * 0.15));
  const L = Math.max(3, Math.round(ry * 0.22)), maxLen = Math.ceil(ry * F.max / 2 * 1.7) + L;
  const pts = F.bounds.map(() => []);
  for (let i = 0; i < NR; i++) {
    const ang = i / NR * 2 * Math.PI, dx = Math.cos(ang), dy = Math.sin(ang), seq = [];
    for (let t = 0; t < maxLen; t++) {
      const x = Math.round(cx + dx * t), y = Math.round(cy + dy * t);
      if (x < 0 || y < 0 || x >= w || y >= h) break;
      seq.push(cls[y * w + x]);
    }
    let start = 0;
    for (let b = 0; b < NB; b++) {
      const cur = CODE[F.bounds[b][0]], nxt = b < NB - 1 ? CODE[F.bounds[b + 1][0]] : 0;
      const ok = q => nxt ? q === nxt : q !== cur;
      let found = -1;
      for (let t = start; t + L <= seq.length; t++) {
        let n = 0; for (let j = 0; j < L; j++) if (ok(seq[t + j])) n++;
        if (n >= 0.7 * L) { found = t; break; }
      }
      if (found < 0) break;
      while (!ok(seq[found])) found++;
      // affinage : la frontière est là où la couleur change le plus vite (insensible au flou)
      let bt = found, bg = -1;
      for (let t = Math.max(2, found - win); t <= found + win; t++) {
        const x1 = Math.round(cx + dx * (t - 2)), y1 = Math.round(cy + dy * (t - 2)), x2 = Math.round(cx + dx * (t + 2)), y2 = Math.round(cy + dy * (t + 2));

/* Charge une image (fichier ou canvas) dans un canvas de travail. On garde jusqu'à 2800 px :

async function loadPhoto(src) {
  let bmp = src;
  if (src instanceof Blob) {
    try { bmp = await createImageBitmap(src, { imageOrientation: "from-image" }); }
    catch { bmp = await new Promise((ok, ko) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ko; im.src = URL.createObjectURL(src); }); }
  }
  const k = Math.min(1, 2800 / Math.max(bmp.width, bmp.height));
  const ph = document.createElement("canvas"); ph.width = Math.round(bmp.width * k); ph.height = Math.round(bmp.height * k);
  ph.getContext("2d", { willReadFrequently: true }).drawImage(bmp, 0, 0, ph.width, ph.height);
  if (bmp.close) bmp.close();

}
async function openPhoto(src) {

  screen = "analyse"; render();

    try { detect(); } catch (e) { console.error(e); A.msg = "L'analyse automatique a échoué : placez le blason et les impacts à la main."; }

}

function validateEnd() {

  const ev = endVals(), arrows = A.hits.map((h, i) => { const l = locate(h.x, h.y); return { v: ev[i].v, x: +l.nx.toFixed(3), y: +l.ny.toFixed(3) }; });

  g.setTransform(dpr * V.s, 0, 0, dpr * V.s, dpr * V.ox, dpr * V.oy);

    for (let R = 1; R <= F.max; R++) {
      const e = ellAt(sp, R), bold = bounds.includes(R) || R === F.max;
      g.beginPath(); g.ellipse(e.cx, e.cy, e.a, e.b, e.th, 0, 2 * Math.PI);
      g.lineWidth = (bold ? 1.8 : 0.9) * px; g.strokeStyle = `rgba(0,255,170,${edit ? 0.95 : bold ? 0.7 : 0.4})`; g.stroke();
    }

      g.beginPath(); g.arc(x, y, 11 * px, 0, 7); g.fillStyle = "rgba(255,255,255,.9)"; g.fill();
      g.lineWidth = 3 * px; g.strokeStyle = "#ff2fb0"; g.stroke();
    }
  }
  A.hits.forEach((h, i) => {
    const loc = locate(h.x, h.y), sr = Math.max(4 * px, loc ? shaftU() * ringPx(A.spots[loc.si]) : 0), sel = i === A.sel;
    g.setLineDash(h.unsure ? [4 * px, 3 * px] : []);
    g.beginPath(); g.arc(h.x, h.y, sr, 0, 7);
    g.lineWidth = 4 * px; g.strokeStyle = "rgba(0,0,0,.6)"; g.stroke();
    g.lineWidth = 2 * px; g.strokeStyle = sel ? "#fff200" : "#ff2fb0"; g.stroke();
    g.setLineDash([]);
    g.beginPath(); g.moveTo(h.x - sr - 5 * px, h.y); g.lineTo(h.x + sr + 5 * px, h.y); g.moveTo(h.x, h.y - sr - 5 * px); g.lineTo(h.x, h.y + sr + 5 * px);
    g.lineWidth = 1 * px; g.stroke();
    g.font = `bold ${15 * px}px system-ui, sans-serif`; g.lineWidth = 4 * px; g.strokeStyle = "rgba(0,0,0,.75)"; g.fillStyle = "#fff";
    const tx = h.x + sr + 6 * px, ty = h.y - sr - 4 * px;

    g.save(); g.beginPath(); g.arc(lx, ly, R, 0, 7); g.clip();
    g.fillStyle = "#111"; g.fillRect(lx - R, ly - R, 2 * R, 2 * R);
    g.drawImage(A.photo, h.x - R / z, h.y - R / z, 2 * R / z, 2 * R / z, lx - R, ly - R, 2 * R, 2 * R);
    g.strokeStyle = "#ff2fb0"; g.lineWidth = 1.5;
    g.beginPath(); g.arc(lx, ly, Math.max(3, sr), 0, 7); g.moveTo(lx - R, ly); g.lineTo(lx - sr - 3, ly); g.moveTo(lx + sr + 3, ly); g.lineTo(lx + R, ly);
    g.moveTo(lx, ly - R); g.lineTo(lx, ly - sr - 3); g.moveTo(lx, ly + sr + 3); g.lineTo(lx, ly + R); g.stroke();
    g.restore();
    g.beginPath(); g.arc(lx, ly, R, 0, 7); g.lineWidth = 3; g.strokeStyle = "#fff"; g.stroke();
    g.font = "bold 20px system-ui, sans-serif"; g.lineWidth = 4; g.strokeStyle = "rgba(0,0,0,.8)"; g.fillStyle = "#fff";
    const v = hitVal(h); g.strokeText(v, lx - R + 4, ly + R - 2); g.fillText(v, lx - R + 4, ly + R - 2);
  }
}

/* Scène : blason à plat et flèches. rand : tirée au hasard (bancs de test) ; sinon scène fixe. */
function demoScene(rand) {
  const W = 1500, H = 2000, tri = S.cfg.face === "tri", rnd = (a, b) => a + Math.random() * (b - a);
  const centers = tri ? [[750, 400], [750, 1000], [750, 1600]] : [[750, 1000]], ring = tri ? 54 : 66;
  const sc = { W, H, tri, centers, ring, sh: shaftU() * 2 * ring, kz: rand ? rnd(0.72, 0.98) : 0.95, rot: rand ? rnd(-0.08, 0.08) : 0.03 };
  sc.list = window._demoList ? window._demoList : !rand ? (tri ? [[0, 0.3, 1.0], [1, 2.6, 3.5], [2, 4.4, 5.5]] : [[0, 0.4, 1], [0, 2.7, 2.5], [0, 5.3, 4], [0, 7.4, 5.2], [0, 1.5, 0.2], [0, 3.6, 3.3]].slice(0, S.cfg.perEnd))
    : tri ? [0, 1, 2].map(i => [i, rnd(0, 5.2), rnd(0, 6.28)]) : Array.from({ length: S.cfg.perEnd }, () => [0, rnd(0, 9.6), rnd(0, 6.28)]);
  const vane = ["#19c37d", "#ff7a1a", "#b44dff"], tubes = ["#16181a", "#16181a", "#3a3d42", "#b9bcc0"];
  sc.arrows = sc.list.map(([si, r, an], n) => {
    const x = centers[si][0] + Math.cos(an) * r * ring, y = centers[si][1] + Math.sin(an) * r * ring;
    let dx = x - W / 2, dy = y - H / 2; if (Math.hypot(dx, dy) < 120) { dx = Math.cos(an + 1); dy = Math.sin(an + 1); }
    return { x, y, a: Math.atan2(dy, dx) + rnd(-0.35, 0.35), L: rand ? rnd(160, 270) : rnd(200, 250), tube: rand ? tubes[(Math.random() * 4) | 0] : tubes[0], vane: vane[n % 3] };
  });
  return sc;
}
/* Dessine la scène à plat ; la transformation en place dans g la place dans l'image. */
function paintScene(g, sc) {
  const F = face(), { centers, ring, sh } = sc;
  g.fillStyle = "#f1efe8"; if (sc.tri) g.fillRect(440, 60, 620, 1880); else g.fillRect(50, 300, 1400, 1400);
  const cols = ["#f6d21c", "#f6d21c", "#e2392f", "#e2392f", "#35a7e6", "#35a7e6", "#1d1d1d", "#1d1d1d", "#f1efe8", "#f1efe8"];
  for (const [cx, cy] of centers) {
    for (let k = F.max; k >= 1; k--) { g.beginPath(); g.arc(cx, cy, k * ring, 0, 7); g.fillStyle = cols[k - 1]; g.fill(); g.lineWidth = 2; g.strokeStyle = k === 7 ? "#eee" : "#222"; g.stroke(); }
    g.beginPath(); g.arc(cx, cy, ring / 2, 0, 7); g.stroke();
  }
  for (const q of sc.arrows) {
    const { x, y, L } = q, ux = Math.cos(q.a), uy = Math.sin(q.a);
    const seg = (t0, t1, wd, col, ox = 0, oy = 0) => { g.beginPath(); g.moveTo(x + ux * t0 + ox, y + uy * t0 + oy); g.lineTo(x + ux * t1 + ox, y + uy * t1 + oy); g.lineWidth = wd; g.strokeStyle = col; g.stroke(); };
    seg(0, L, sh, "rgba(0,0,0,.22)", 10, 14);
    seg(0, L, sh, q.tube); seg(L * 0.66, L * 0.95, sh * 4, q.vane); seg(L * 0.95, L, sh * 1.3, "#f2f2f2");
    // le tube est un cylindre planté dans la cible : son bout visible est arrondi, centré sur le trou
    g.beginPath(); g.arc(x, y, sh / 2, 0, 7); g.fillStyle = q.tube; g.fill();
  }
}
function makeDemo(rand) {
  const sc = demoScene(rand), { W, H } = sc, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), rnd = (a, b) => a + Math.random() * (b - a);
  g.fillStyle = "#8a7355"; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 3500; i++) { g.fillStyle = `rgba(${rnd(60, 120) | 0},${rnd(45, 85) | 0},${rnd(25, 55) | 0},.3)`; g.fillRect(rnd(0, W), rnd(0, H), rnd(30, 90), 3); }
  g.save(); g.translate(W / 2, H / 2); g.rotate(sc.rot); g.scale(sc.kz, sc.kz); g.translate(-W / 2, -H / 2);
  const tf = g.getTransform(); paintScene(g, sc); g.restore();
  const flat = sc.arrows.map(q => [tf.a * q.x + tf.c * q.y + tf.e, tf.b * q.x + tf.d * q.y + tf.f]);
  // perspective : les 4 coins de la scène à plat sont déplacés, comme une photo prise de biais
  const o = rand ? () => rnd(-110, 110) : null;
  const dst = rand ? [[o(), o()], [W + o(), o()], [W + o(), H + o()], [o(), H + o()]] : [[45, 30], [W - 70, 10], [W - 25, H - 45], [55, H - 20]];
  const src = [[0, 0], [W, 0], [W, H], [0, H]], M = [];
  src.forEach(([x, y], i) => { const [X, Y] = dst[i]; M.push([x, y, 1, 0, 0, 0, -x * X, -y * X, X], [0, 0, 0, x, y, 1, -x * Y, -y * Y, Y]); });
  const hm = gauss(M.map(r => Float64Array.from(r))), h = [...hm, 1];
  const inv = [h[4] * h[8] - h[5] * h[7], h[2] * h[7] - h[1] * h[8], h[1] * h[5] - h[2] * h[4], h[5] * h[6] - h[3] * h[8], h[0] * h[8] - h[2] * h[6], h[2] * h[3] - h[0] * h[5], h[3] * h[7] - h[4] * h[6], h[1] * h[6] - h[0] * h[7], h[0] * h[4] - h[1] * h[3]];
  const sd = g.getImageData(0, 0, W, H), s = sd.data, od = g.createImageData(W, H), d = od.data;
  for (let Y = 0, j = 0; Y < H; Y++) for (let X = 0; X < W; X++, j += 4) {
    const q = inv[6] * X + inv[7] * Y + inv[8], x = (inv[0] * X + inv[1] * Y + inv[2]) / q, y = (inv[3] * X + inv[4] * Y + inv[5]) / q;
    const x0 = Math.floor(x), y0 = Math.floor(y);
    if (x0 < 0 || y0 < 0 || x0 >= W - 1 || y0 >= H - 1) { d[j] = 70; d[j + 1] = 62; d[j + 2] = 55; d[j + 3] = 255; continue; }
    const fx = x - x0, fy = y - y0, i = (y0 * W + x0) * 4;
    for (let k = 0; k < 3; k++) d[j + k] = (s[i + k] * (1 - fx) + s[i + 4 + k] * fx) * (1 - fy) + (s[i + W * 4 + k] * (1 - fx) + s[i + W * 4 + 4 + k] * fx) * fy;
    d[j + 3] = 255;
  }
  g.putImageData(od, 0, 0);
  g.filter = `blur(${rand ? rnd(0.6, 2).toFixed(1) : 1}px)`; g.drawImage(c, 0, 0); g.filter = "none";
  const ga = rand ? rnd(0, 6.28) : 0.9, sh2 = g.createLinearGradient(W / 2 - Math.cos(ga) * 1200, H / 2 - Math.sin(ga) * 1200, W / 2 + Math.cos(ga) * 1200, H / 2 + Math.sin(ga) * 1200);
  sh2.addColorStop(0, "rgba(0,0,0,0)"); sh2.addColorStop(1, `rgba(0,0,0,${rand ? rnd(0.1, 0.4) : 0.3})`);
  g.fillStyle = sh2; g.fillRect(0, 0, W, H);
  if (rand) { g.fillStyle = Math.random() < 0.5 ? `rgba(255,190,110,${rnd(0, 0.12)})` : `rgba(120,160,255,${rnd(0, 0.1)})`; g.fillRect(0, 0, W, H); }   // dominante de couleur
  const warp = ([x, y]) => { const q = h[6] * x + h[7] * y + 1; return [(h[0] * x + h[1] * y + h[2]) / q, (h[3] * x + h[4] * y + h[5]) / q]; };
  sc.toPhoto = (x, y) => warp([tf.a * x + tf.c * y + tf.e, tf.b * x + tf.d * y + tf.f]);   // scène à plat -> photo
  window._demoScene = sc;
  window._demoPts = flat.map(warp);
  window._demoR = sc.list.map(q => q[1]);
  window._demoTruth = sc.list.map(q => scoreAt(q[1]));
  return c;
}
/* Banc de test : n scènes au hasard, comparaison détection / vérité. */
window.selfTest = n => {
  const keep = A, res = []; let extra = 0, noFace = 0;
  for (let i = 0; i < n; i++) {
    A = { photo: makeDemo(true), spots: [], hits: [], sel: -1, mode: "hits" }; detect();
    (window._q = window._q || []).push(A.q);
    if (A.spots.length !== (S.cfg.face === "tri" ? 3 : 1)) noFace++;
    const used = new Set();
    window._demoPts.forEach((p, j) => {
      let b = -1, bd = 1e9; A.hits.forEach((hh, k) => { const dd = Math.hypot(hh.x - p[0], hh.y - p[1]); if (dd < bd && !used.has(k)) { bd = dd; b = k; } });
      const loc = b >= 0 ? hitLoc(A.hits[b]) : null, ok = !!loc && bd / ringPx(A.spots[loc.si]) < 1;
      if (ok) used.add(b);
      const hh = ok ? A.hits[b] : null, re = window._demoR[j] - shaftU();
      res.push({ near: loc ? bd / ringPx(A.spots[loc.si]) : -1, nh: A.hits.length, r: window._demoR[j], truth: window._demoTruth[j], found: ok, err: ok ? bd / ringPx(A.spots[loc.si]) : null, rerr: ok ? loc.r - window._demoR[j] : null,
        val: ok ? hitVal(hh) : null, unsure: ok && !!hh.unsure, cordon: ok && cordon(hh), fine: ok && !!hh.fine, cal: ok && !!hh.cal, dr: ok ? hh.dr || 0 : 0, tight: Math.abs(re - Math.round(re)) < 0.1 || Math.abs(re - 0.5) < 0.1 });
    });
    extra += A.hits.length - used.size;
  }
  A = keep; return { res, extra, noFace };
};

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
window.androidBack = () => { if (screen === "home") return false; hdrBack.onclick(); return true; };

render();
</script>
